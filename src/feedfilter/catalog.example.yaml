# A starting point for your own source list. Copy it before editing:
#
#     cp src/feedfilter/catalog.example.yaml data/catalog.yaml
#
# The copy is yours and is not tracked by git, so pulling never argues with your
# curation. This file is the shared starting point and only changes by pull request.
#
# Every URL here has been fetched and parsed by scripts/verify_catalog.py -- a feed that
# has never answered does not belong in this file. A feed that stops answering ships as
# `enabled: false` with a line saying why, rather than being deleted: the note is what
# stops the next person spending an afternoon rediscovering the same dead end.
#
# The list deliberately spans the political spectrum. Filtering is the model's job; a
# curated list that only carries one point of view has done the filtering in advance and
# hidden it.
#
# Fields mirror the Source table. `country` is the audience a feed is written for, left
# empty when it has no particular one; `topic` is the coarse bucket the UI filters on.

