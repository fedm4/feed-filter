[project]
name = "feed-filter"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi",
    "feedparser>=6.0.14",
    "httpx",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.1",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.0.54",
    "trafilatura>=2.2.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pr-agent",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feedfilter"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters by calling these in a default. B008 is right
# in general and wrong here.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
