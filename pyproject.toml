[project]
name = "feed-filter"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = [
    "fastapi",
    "feedparser>=6.0.14",
    "httpx",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pr-agent",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feedfilter"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
